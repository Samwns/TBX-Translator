name: Create release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag da release (ex.: v0.0.1-alpha)"
        required: true
        default: "v0.0.1-alpha"
        type: string
      release_name:
        description: "Nome mostrado na release"
        required: true
        default: "TBX Translator v0.0.1-alpha"
        type: string
      prerelease:
        description: "Marcar como pré-release/alpha"
        required: true
        default: true
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev ruby-full
      - name: Build Linux application and Unity extractor
        run: |
          cargo build --release
          mkdir -p package-root/opt/tbx-translator
          install -m 755 target/release/tbx-translator package-root/opt/tbx-translator/TBX-Translator
          dotnet publish unity_static_extractor/unity_static_extractor.csproj \
            --configuration Release --runtime linux-x64 --self-contained true \
            --output package-root/opt/tbx-translator/unity_static_extractor
          cp -r assets BepInEx XUnity_AutoTranslator_bepInEx package-root/opt/tbx-translator/
          install -Dm755 packaging/linux/tbx-translator package-root/usr/bin/tbx-translator
          install -Dm644 packaging/linux/tbx-translator.desktop package-root/usr/share/applications/tbx-translator.desktop
          install -Dm644 assets/com.tbx.translator.svg package-root/usr/share/icons/hicolor/scalable/apps/com.tbx.translator.svg
          sudo gem install fpm --no-document
          mkdir -p release
          fpm -s dir -t deb -n tbx-translator -v 0.0.1 -C package-root -p release/TBX-Translator-Debian-Ubuntu-amd64.deb --license "CC-BY-NC-SA-4.0" --depends libgtk-4-1 opt usr
          fpm -s dir -t rpm -n tbx-translator -v 0.0.1 -C package-root -p release/TBX-Translator-Fedora-x86_64.rpm --license "CC-BY-NC-SA-4.0" --depends gtk4 opt usr
          fpm -s dir -t pacman -n tbx-translator -v 0.0.1 -C package-root -p release/TBX-Translator-Arch-x86_64.pkg.tar.zst --license "CC-BY-NC-SA-4.0" --depends gtk4 opt usr
          mkdir -p AppDir/usr/bin
          cp -r package-root/opt/tbx-translator/* AppDir/usr/bin/
          install -m755 packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/tbx-translator.desktop AppDir/tbx-translator.desktop
          cp assets/com.tbx.translator.svg AppDir/com.tbx.translator.svg
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir release/TBX-Translator-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-Linux-x64
          path: |
            release/TBX-Translator-Debian-Ubuntu-amd64.deb
            release/TBX-Translator-Fedora-x86_64.rpm
            release/TBX-Translator-Arch-x86_64.pkg.tar.zst
            release/TBX-Translator-x86_64.AppImage

  windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust
            zip
      - name: Build Windows application and Unity extractor
        run: |
          # Use the MSYS2/MinGW64 Rust toolchain. GTK4 and pkg-config then
          # target Windows natively, instead of being cross-compiled from MSVC.
          export PATH="/mingw64/bin:$PATH"
          command -v cargo
          rustc -Vv
          cargo build --release
          mkdir -p release/TBX-Translator-Windows-x64
          cp target/release/tbx-translator.exe release/TBX-Translator-Windows-x64/TBX-Translator.exe
          "/c/Program Files/dotnet/dotnet.exe" publish unity_static_extractor/unity_static_extractor.csproj \
            --configuration Release --runtime win-x64 --self-contained true \
            --output release/TBX-Translator-Windows-x64/unity_static_extractor
          cp -r assets BepInEx XUnity_AutoTranslator_bepInEx release/TBX-Translator-Windows-x64/
          cp /mingw64/bin/*.dll release/TBX-Translator-Windows-x64/
          cp README.md LICENSE release/TBX-Translator-Windows-x64/
      - name: Build Windows installer
        shell: powershell
        run: choco install innosetup -y
      - name: Package Windows installer
        run: '"/c/Program Files (x86)/Inno Setup 6/ISCC.exe" packaging/windows/tbx-translator.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-Windows-x64
          path: release/TBX-Translator-Setup.exe

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create release with both packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name || format('TBX Translator {0}', github.ref_name) }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.pkg.tar.zst
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.exe
