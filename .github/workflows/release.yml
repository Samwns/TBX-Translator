name: Create release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: version
        shell: bash
        run: |
          base_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          base_version="${base_version%%-*}"
          tag_name="v${base_version}-build-${{ github.run_number }}"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=TBX Translator v${base_version} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GTK4 and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev ruby-full libarchive-tools
      - name: Create Linux release packages
        run: cargo package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-Linux-x64
          path: |
            release/TBX-Translator-Debian-Ubuntu-amd64.deb
            release/TBX-Translator-Fedora-x86_64.rpm
            release/TBX-Translator-Arch-x86_64.pkg.tar.zst
            release/TBX-Translator-x86_64.AppImage

  windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust
            zip
      - name: Create Windows installer
        env:
          TBX_MSYS_BASH: ${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe
        run: |
          export PATH="/mingw64/bin:$PATH"
          cargo package-windows
      - uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-Windows-x64
          path: release/TBX-Translator-Setup.exe

  publish:
    name: Publish GitHub release
    needs: [prepare-release, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create release with both packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ needs.prepare-release.outputs.release_name }}

            ### Downloads

            - **Windows:** `TBX-Translator-Setup.exe`
            - **Debian / Ubuntu:** `TBX-Translator-Debian-Ubuntu-amd64.deb`
            - **Fedora:** `TBX-Translator-Fedora-x86_64.rpm`
            - **Arch Linux:** `TBX-Translator-Arch-x86_64.pkg.tar.zst`
            - **Linux portátil:** `TBX-Translator-x86_64.AppImage`

            ### Apoie o projeto

            [Ko-fi — samwns](https://ko-fi.com/samwns)

            ### Licença

            CC BY-NC-SA 4.0 — uso e redistribuição não comerciais, com atribuição.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ needs.prepare-release.outputs.tag_name }}
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.pkg.tar.zst
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.exe
