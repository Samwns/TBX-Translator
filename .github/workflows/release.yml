name: Create release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "README.en.md"
      - "docs/**"
      - "site/**"
      - ".github/**"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
      base_version: ${{ steps.version.outputs.base_version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          base_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
          base_version="${base_version%%-*}"
          tag_name="v${base_version}-build-${{ github.run_number }}"
          previous_tag="$(git tag --list "v${base_version}-build-*" --sort=-v:refname | head -n 1)"
          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=TBX Translator v${base_version} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${previous_tag}" >> "$GITHUB_OUTPUT"

  linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    env:
      TBX_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GTK4 and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev ruby-full libarchive-tools
      - name: Create Linux release packages
        run: cargo package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-Linux-x64
          path: |
            release/TBX-Translator-Debian-Ubuntu-amd64.deb
            release/TBX-Translator-Fedora-x86_64.rpm
            release/TBX-Translator-Arch-x86_64.pkg.tar.zst
            release/TBX-Translator-x86_64.AppImage

  windows:
    name: Build Windows x64
    runs-on: windows-latest
    env:
      TBX_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-gtk4
            zip
      - name: Create Windows installer
        env:
          TBX_MSYS_BASH: ${{ steps.msys2.outputs.msys2-location }}\usr\bin\bash.exe
        run: |
          export PATH="/mingw64/bin:$PATH"
          cargo package-windows
      - uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-Windows-x64
          path: |
            release/TBX-Translator-Windows-x64.zip
            release/TBX-Translator-Setup.exe

  publish:
    name: Publish GitHub release
    needs: [prepare-release, linux, windows]
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_MEMBER_ROLE_ID: ${{ secrets.DISCORD_MEMBER_ROLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Generate release and Discord messages
        run: |
          bash scripts/generate-release-notes.sh \
            "${{ needs.prepare-release.outputs.base_version }}" \
            "${{ github.run_number }}" \
            "${{ needs.prepare-release.outputs.previous_tag }}" \
            release-messages
      - name: Create release with both packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          prerelease: false
          generate_release_notes: false
          body_path: release-messages/release-body.md
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.pkg.tar.zst
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.zip
            release-artifacts/**/*.exe
      - name: Upload generated messages
        uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-release-messages
          path: release-messages/*.md
      - name: Publish update on Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          if [[ -n "$DISCORD_MEMBER_ROLE_ID" ]]; then
            MEMBER_MENTION="<@&${DISCORD_MEMBER_ROLE_ID}>" \
              perl -0pi -e 's/\@Member/$ENV{MEMBER_MENTION}/g' release-messages/discord-update.md
          fi
          jq -Rs '{content: ., allowed_mentions: {parse: ["everyone", "roles"]}}' \
            release-messages/discord-update.md > release-messages/discord-payload.json
          curl --fail-with-body \
            -H 'Content-Type: application/json' \
            --data-binary @release-messages/discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
