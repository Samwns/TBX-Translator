name: Create release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag da release (ex.: v0.0.1-alpha)"
        required: true
        default: "v0.0.1-alpha"
        type: string
      release_name:
        description: "Nome mostrado na release"
        required: true
        default: "TBX Translator v0.0.1-alpha"
        type: string
      prerelease:
        description: "Marcar como pré-release/alpha"
        required: true
        default: true
        type: boolean
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and packaging tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev ruby-full
      - name: Create Linux release packages
        run: cargo package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-Linux-x64
          path: |
            release/TBX-Translator-Debian-Ubuntu-amd64.deb
            release/TBX-Translator-Fedora-x86_64.rpm
            release/TBX-Translator-Arch-x86_64.pkg.tar.zst
            release/TBX-Translator-x86_64.AppImage

  windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-rust
            zip
      - name: Create Windows installer
        run: |
          export PATH="/mingw64/bin:$PATH"
          cargo package-windows
      - uses: actions/upload-artifact@v4
        with:
          name: TBX-Translator-Windows-x64
          path: release/TBX-Translator-Setup.exe

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create release with both packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name || format('TBX Translator {0}', github.ref_name) }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.pkg.tar.zst
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.exe
