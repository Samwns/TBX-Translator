[package]
name = "tbx-translator"
version = "0.0.1-alpha"
edition = "2021"
default-run = "tbx-translator"
authors = ["samwns"]
description = "TBX Translator : Toolbox - Translator (alpha)"

[dependencies]
gtk4 = "0.7.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1.3"
regex = "1"
dirs = "6"
walkdir = "2.5.0"
image = "0.25.10"
rusttype = "0.9.3"
zip = "0.6"
bytes = "1"

[build-dependencies]
winres = "0.1"
