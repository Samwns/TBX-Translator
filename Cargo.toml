[package]
name = "tbx-translator"
version = "0.0.2-alpha"
edition = "2021"
default-run = "tbx-translator"
authors = ["samwns"]
description = "TBX Translator : Toolbox - Translator (alpha)"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "svg"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2.1.3"
regex = "1"
dirs = "6"
walkdir = "2.5.0"
image = "0.25"
rusttype = "0.9.3"
zip = "0.6"
bytes = "1"
sha2 = "0.10"
zbus = { version = "5.17", default-features = false, features = ["tokio"] }

[build-dependencies]
winres = "0.1"
